# Netlify bouwt en host de echte site — met een Node-runtime, dus mét het
# afspraakformulier dat de aanvraag mailt. (De GitHub Pages-workflow in
# .github/workflows/preview.yml blijft een statische preview zonder mail.)
#
# Let op: zet NEXT_PUBLIC_STATIC_EXPORT hier of in de Netlify-omgeving nooit
# op "1". Dan bouwt Next een statische export en wordt het formulier
# vervangen door de stand-in die niets verstuurt.

[build]
  # Draait eerst scripts/generate-content.mjs (prebuild) en dan next build.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

  # Netlify's secret-scanner controleert of de waarde van een omgevings-
  # variabele ergens in de repo of de build-output staat, en breekt de build
  # af als dat zo is. Voor RESEND_API_KEY is dat precies goed. Maar het
  # afzender- en ontvangeradres zijn geen geheimen — ze staan in de kop van
  # elke verstuurde mail — en ze staan als voorbeeld in .env.example en
  # content.yml. Zonder deze regel faalt de build daarop.
  SECRETS_SCAN_OMIT_KEYS = "RESERVATION_FROM,RESERVATION_TO"
